apiVersion: apps/v1
kind: Deployment
metadata:
  name: results-server
  namespace: sort-benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: results-server
  template:
    metadata:
      labels:
        app: results-server
    spec:
      containers:
        - name: server
          image: localhost:5001/external-sort:latest
          imagePullPolicy: Always
          command: ["python", "/app/src/results_server.py"]
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: benchmark-data
---
apiVersion: v1
kind: Service
metadata:
  name: results-server
  namespace: sort-benchmark
spec:
  type: NodePort
  selector:
    app: results-server
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
