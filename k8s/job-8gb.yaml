apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-8gb
  namespace: sort-benchmark
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sort-benchmark
        size: 8gb
    spec:
      restartPolicy: Never
      containers:
        - name: sorter
          image: localhost:5001/external-sort:latest
          imagePullPolicy: Always
          command: ["python", "/app/src/run_benchmark.py", "--ram-gb", "8"]
          resources:
            requests:
              memory: "8Gi"
              cpu: "1"
            limits:
              memory: "8Gi"
              cpu: "2"
          env:
            - name: TMPDIR
              value: /tmp/sort-runs
          volumeMounts:
            - name: data
              mountPath: /data
            - name: sort-tmp
              mountPath: /tmp/sort-runs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: benchmark-data
        - name: sort-tmp
          emptyDir:
            sizeLimit: 8Gi
